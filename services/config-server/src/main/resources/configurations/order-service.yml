server:
  port: 8070

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/order
    username: alibou
    password: alibou
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Mapeia o identificador diretamente para a classe Java DTO
      properties:
        spring.json.type.mapping: orderConfirmation:com.beans.ecommerce.kafka.OrderConfirmation

# Endereços dos endpoints dos outros microserviços (passando pelo API Gateway na porta 8222).
# Usados pelo RestClient, WebClient ou FeignClient para efetuar chamadas HTTP diretas entre serviços.
application:
  config:
    customer-url: http://localhost:8222/api/v1/customers
    payment-url: http://localhost:8222/api/v1/payments
    product-url: http://localhost:8222/api/v1/products